name: AI Game Dev Loop
on:
  workflow_dispatch:
    inputs:
      iteration:
        description: '現在のイテレーション番号（0 = 初回）'
        required: true
        default: '0'

permissions:
  contents: write
  actions: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-coder-7b-v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Build prompt
        run: |
          ITER=${{ github.event.inputs.iteration }}
          if [ "$ITER" = "0" ]; then
            cp prompt.txt full_prompt.txt
          else
            {
              cat prompt.txt
              echo -e "\n--- 現在のコード（game/ 以下） ---"
              if [ -d game ]; then
                find game -type f \
                  \( -name '*.py' -o -name '*.js' -o -name '*.html' -o -name '*.css' -o -name '*.json' \) \
                  -exec echo -e "\n### {}" \; -exec head -c 3000 {} \;
              fi
            } > full_prompt.txt
          fi

      - name: Run AI
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5-coder:7b
          ollama run qwen2.5-coder:7b "$(cat full_prompt.txt)" > ai_output.md

      - name: Apply & commit
        run: |
          python3 apply_changes.py ai_output.md game/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "AI dev iteration ${{ github.event.inputs.iteration }}"
          git push

      - name: Trigger next iteration
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT=$(( ${{ github.event.inputs.iteration }} + 1 ))
          gh workflow run "AI Game Dev Loop" -f iteration="$NEXT"
