name: AI Game Dev Loop
on:
  workflow_dispatch:
    inputs:
      iteration:
        description: '現在のイテレーション番号（0 = 初回）'
        required: true
        default: '0'

permissions:
  contents: write
  actions: write

env:
  MODEL_REPO: "Qwen/Qwen2.5-Coder-7B-Instruct-GGUF"
  MODEL_FILE: "qwen2.5-coder-7b-instruct-q4_k_m.gguf"
  LLAMA_VERSION: "b12289"

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache GGUF model
        id: cache-gguf
        uses: actions/cache@v4
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ env.MODEL_REPO }}-${{ env.MODEL_FILE }}-v1

      - name: Download GGUF model (cache miss only)
        if: steps.cache-gguf.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade huggingface_hub hf_transfer
          mkdir -p gguf-cache
          HF_HUB_ENABLE_HF_TRANSFER=1 \
            hf download "$MODEL_REPO" "$MODEL_FILE" --local-dir gguf-cache

      - name: Install llama.cpp prebuilt
        run: |
          set -e
          mkdir -p llama
          cd llama

          BASE="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}"

          if curl -fsSL -o pkg.zip "${BASE}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.zip"; then
            unzip -q pkg.zip
          elif curl -fsSL -o pkg.tar.gz "${BASE}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.tar.gz"; then
            tar -xzf pkg.tar.gz
          else
            echo "prebuiltが見つかりません: ${BASE}" >&2
            exit 1
          fi
          cd ..

          CLI=$(find llama -type f -name 'llama-cli' | head -1)
          if [ -z "$CLI" ]; then
            echo "llama-cliが見つかりません" >&2
            find llama -maxdepth 4 -type f | head -100 >&2
            exit 1
          fi
          CLI_DIR=$(dirname "$CLI")
          chmod +x "$CLI"
          echo "llama-cli: $CLI"
          echo "$PWD/$CLI_DIR" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/$CLI_DIR:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build prompt
        run: |
          ITER=${{ github.event.inputs.iteration }}
          if [ "$ITER" = "0" ]; then
            cp prompt.txt full_prompt.txt
          else
            {
              cat prompt.txt
              echo -e "\n--- 現在のコード（game/ 以下） ---"
              if [ -d game ]; then
                find game -type f \
                  \( -name '*.py' -o -name '*.js' -o -name '*.html' -o -name '*.css' -o -name '*.json' \) \
                  -exec echo -e "\n### {}" \; -exec head -c 3000 {} \;
              fi
            } > full_prompt.txt
          fi

      - name: Run AI (llama.cpp)
        run: |
          BIN_DIR=$(find llama -type d -name bin | head -1)
          export PATH="$PWD/${BIN_DIR}:$PATH"
          export LD_LIBRARY_PATH="$PWD/${BIN_DIR}:${LD_LIBRARY_PATH}"
          llama-cli \
            -m "gguf-cache/${MODEL_FILE}" \
            --file full_prompt.txt \
            -no-cnv \
            -n 2048 \
            --temp 0.2 \
            -t $(nproc) \
            > ai_output.md

      - name: Apply & commit
        run: |
          python3 apply_changes.py ai_output.md game/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "AI dev iteration ${{ github.event.inputs.iteration }}"
          git push

      - name: Trigger next iteration
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT=$(( ${{ github.event.inputs.iteration }} + 1 ))
          gh workflow run "AI Game Dev Loop" -f iteration="$NEXT"
